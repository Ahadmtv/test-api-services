        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/admin/payouts/{payoutID}/reject:
    post:
      summary: رد درخواست تسویه (مدیر)
      description: مدیر درخواست requested را رد می‌کند؛ مبلغ رزروشده در همان تراکنش به درآمد ارائه‌دهنده بازمی‌گردد.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PayoutID'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutAdminInput' }
      responses:
        '200':
          description: درخواست ردشده
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/admin/payouts/{payoutID}/processing:
    post:
      summary: آغاز پردازش دستی (مدیر)
      description: مدیر درخواست approved را به processing می‌برد در حالی که انتقال بیرونی انجام می‌شود.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PayoutID'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutAdminInput' }
      responses:
        '200':
          description: درخواست در حال پردازش
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/admin/payouts/{payoutID}/paid:
    post:
      summary: ثبت پرداخت دستی (مدیر)
      description: مدیر تأیید می‌کند انتقال بیرونی (شبکه بانکی) کامل شده است؛ ارجاع انتقال نمی‌تواند برهان باشد و مبلغ رزروشده به حساب clearing تسویه منتقل می‌شود.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PayoutID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_transfer_reference]
              additionalProperties: false
              properties:
                external_transfer_reference: { type: string, minLength: 1, maxLength: 128 }
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: درخواست پرداخت‌شده
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutRequest' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/admin/payouts/{payoutID}/fail:
    post:
      summary: ثبت شکست انتقال (مدیر)
      description: مدیر انتقال بیرونی ناموفق را ثبت می‌کند؛ مبلغ رزروشده به درآمد ارائه‌دهنده بازمی‌گردد.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PayoutID'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutAdminInput' }
      responses:
        '200':
          description: درخواست ناموفق
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: شناسه آخرین رکورد صفحه قبلی
      schema:
        type: integer
        format: int64
        minimum: 1
    Limit:
      name: limit
      in: query
      required: false
      description: تعداد رکورد صفحه، پیش‌فرض 50 و حداکثر 100
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ServiceID:
      name: serviceID
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProviderID:
      name: providerID
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    BookingID:
      name: bookingID
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PayoutID:
      name: payoutID
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    LayoutIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: کلید اختیاری idempotency؛ بازپخش همان کلید همان نتیجه terminal را بدون اثر تازه برمی‌گرداند
      schema:
        type: string
        maxLength: 128
  responses:
    Problem:
      description: خطای پایدار API
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AuthRegisterInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string }
        password: { type: string, minLength: 8 }
    AuthLoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    AuthRefreshInput:
      type: object
      properties:
        refresh_token: { type: string }
    OperationResult:
      type: object
      required: [status, message]
      properties:
        status: { type: string }
        message: { type: string }
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token:
          type: string
          description: توکن Refresh فقط یک‌بار در همین پاسخ به‌صورت متن‌خام برگردانده می‌شود و در پایگاه داده هش می‌شود.
        expires_in: { type: integer, format: int64, description: عمر توکن دسترسی به ثانیه }
    User:
      type: object
      required: [id, email, is_active, roles]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        is_active: { type: boolean }
        roles:
          type: array
          items: { type: string }
    AdminUser:
      type: object
      required: [id, email, phone, display_name, roles, is_active, created_at]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        display_name: { type: string, maxLength: 160 }
        roles:
          type: array
          items:
            type: string
            enum: [client, provider, admin]
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
    AdminUserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        next_cursor:
          type: [integer, 'null']
          format: int64
          minimum: 1
    AdminRoleMutationInput:
      type: object
      additionalProperties: false
      required: [granted]
      properties:
        granted: { type: boolean }
    AdminProvider:
      type: object
      required: [provider_id, display_name, verification_status, is_active, profile_completed, owner_email, created_at, updated_at]
      properties:
        provider_id: { type: integer, format: int64 }
        display_name: { type: string, maxLength: 160, description: تا تکمیل نمایه ممکن است خالی باشد }
        verification_status:
          type: string
          enum: [pending, verified, rejected]
        is_active: { type: boolean }
        profile_completed:
          type: boolean
          description: درست یعنی نام نمایشی نمایه پر شده و ارائه‌دهنده قابل تأیید است
        owner_email: { type: string, format: email, description: از contact مالک حساب ارائه‌دهنده؛ فقط برای مدیر }
        owner_phone:
          type: [string, 'null']
          description: تلفن مالک؛ فقط برای مدیر
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminProviderPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminProvider'
        next_cursor:
          type: [integer, 'null']
          format: int64
          minimum: 1
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        request_id: { type: string }
        field_errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
    ProviderProfile:
      type: object
      required: [provider_id, display_name, description, time_zone, is_active, verification_status]
      properties:
        provider_id: { type: integer, format: int64 }
        display_name: { type: string, maxLength: 160 }
        description: { type: string }
        time_zone: { type: string, default: Asia/Tehran }
        is_active: { type: boolean }
        verification_status:
          type: string
          enum: [pending, verified, rejected]
    ProviderProfileInput:
      type: object
      required: [display_name, is_active]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string }
        time_zone:
          type: string
          description: نام منطقه زمانی معتبر IANA
          default: Asia/Tehran
        is_active: { type: boolean }
    ServiceCategory:
      type: string
      description: دسته‌بندی خدمات زیبایی و مراقبت شخصی. مقدار `other` برای خدمات بازبینی‌نشده یا قدیمی نگه داشته می‌شود و نباید به‌عنوان یک دسته‌بندی تبلیغاتی جدید استفاده شود.
      enum:
        - haircut
        - hair-color
        - hair-care
        - makeup
        - eyebrow-lash
        - nails
        - skin-care
        - waxing
        - massage
        - spa
        - bridal
        - barbering
        - other
    Service:
      type: object
      required: [id, provider_id, name, description, category, duration_minutes, price_irr, buffer_minutes, is_active]
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        category:
          $ref: '#/components/schemas/ServiceCategory'
        duration_minutes: { type: integer, minimum: 1, maximum: 1440 }
        price_irr: { type: integer, format: int64, minimum: 0, description: مبلغ صحیح ریال }
        buffer_minutes: { type: integer, minimum: 0, maximum: 1440 }
        is_active: { type: boolean }
        provider_display_name:
          type: string
          maxLength: 160
          description: نام نمایشی ارائه‌دهنده خدمت؛ برای نمایش در فهرست عمومی
    ServiceInput:
      type: object
      required: [name, duration_minutes, price_irr]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string }
        category:
          allOf:
            - $ref: '#/components/schemas/ServiceCategory'
          description: در صورت ارسال‌نشدن، خدمت با دسته‌بندی `other` ثبت می‌شود.
        duration_minutes: { type: integer, minimum: 1, maximum: 1440 }
        price_irr: { type: integer, format: int64, minimum: 0 }
        buffer_minutes: { type: integer, minimum: 0, maximum: 1440, default: 0 }
        is_active: { type: boolean, default: true }
    ServicePatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string }
        category:
          $ref: '#/components/schemas/ServiceCategory'
        duration_minutes: { type: integer, minimum: 1, maximum: 1440 }
        price_irr: { type: integer, format: int64, minimum: 0 }
        buffer_minutes: { type: integer, minimum: 0, maximum: 1440 }
        is_active: { type: boolean }
    ServicePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Service' }
        next_cursor:
          type: [integer, 'null']
          format: int64
    WorkingInterval:
      type: object
      required: [weekday, opens_at, closes_at]
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7, description: روز ISO-8601؛ دوشنبه 1 و یکشنبه 7 }
        opens_at:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          description: ساعت محلی HH:MM در منطقه زمانی نمایه
        closes_at:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          description: پایان همان روز و بزرگ‌تر از آغاز
    TimeOff:
      type: object
      required: [id, kind, starts_at, ends_at, reason]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [time_off, blocked, holiday] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        reason: { type: string }
        holiday_date: { type: [string, 'null'], format: date }
    TimeOffInput:
      oneOf:
        - type: object
          required: [kind, starts_at, ends_at]
          properties:
            kind: { type: string, enum: [time_off, blocked] }
            starts_at: { type: string, format: date-time }
            ends_at: { type: string, format: date-time }
            reason: { type: string, maxLength: 500 }
        - type: object
          required: [kind, holiday_date]
          properties:
            kind: { type: string, const: holiday }
            holiday_date: { type: string, format: date }
    TimeOffPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TimeOff' }
        next_cursor:
          type: [integer, 'null']
          format: int64
    WalletBalance:
      type: object
      required: [available_irr, held_irr, provider_earnings_irr, provider_payout_reserved_irr, currency]
      properties:
        available_irr: { type: integer, format: int64, minimum: 0, description: مانده قابل‌استفاده صحیح ریال }
        held_irr: { type: integer, format: int64, minimum: 0, description: مبلغ قفل‌شده صحیح ریال }
        provider_earnings_irr: { type: integer, format: int64, minimum: 0, description: درآمد قابل‌تسویه داخلی ارائه‌دهنده }
        provider_payout_reserved_irr: { type: integer, format: int64, minimum: 0, description: سهم درآمد ارائه‌دهنده که در دفتر کل به درخواست تسویه فعال رزرو شده است }
        currency: { type: string, const: IRR }
    WalletTransaction:
      type: object
      required: [id, reference, kind, created_at, amount_irr]
      properties:
        id: { type: integer, format: int64 }
        reference: { type: string }
        kind: { type: string, enum: [funding, hold_place, hold_release, refund_release, hold_settle, reversal, payout_reserve, payout_release, payout_paid] }
        created_at: { type: string, format: date-time }
        amount_irr: { type: integer, format: int64, minimum: 1, description: بزرگ‌ترین مبلغ ثبت‌شده در حساب‌های متعلق به این کاربر برای سند موردنظر }
    WalletTransactionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WalletTransaction' } }
        next_cursor: { type: [integer, 'null'], format: int64 }
    PaymentCreateInput:
      type: object
      additionalProperties: false
      properties:
        purpose:
          type: string
          enum: [wallet_topup, booking]
          description: هدف پرداخت؛ wallet_topup شارژ کیف پول (پیش‌فرض) و booking پرداخت مستقیم رزرو است
        amount_irr: { type: integer, format: int64, minimum: 10000, description: فقط برای wallet_topup؛ مبلغ صحیح ریال که Zarinpal دریافت می‌کند }
        booking_id: { type: integer, format: int64, minimum: 1, description: فقط برای booking؛ مبلغ از snapshot معتبر سرور خوانده می‌شود و نباید ارسال شود }
      oneOf:
        - required: [amount_irr]
        - required: [booking_id]
    Payment:
      type: object
      required: [id, amount_irr, purpose, status, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        amount_irr: { type: integer, format: int64, minimum: 0 }
        purpose: { type: string, enum: [wallet_topup, booking] }
        booking_id: { type: [integer, 'null'], format: int64 }
        status: { type: string, enum: [created, pending, succeeded, failed, verification_unknown] }
        authority: { type: [string, 'null'] }
        gateway_reference_id: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        succeeded_at: { type: [string, 'null'], format: date-time }
    PaymentCreateResponse:
      type: object
      required: [payment]
      properties:
        payment: { $ref: '#/components/schemas/Payment' }
        redirect_url: { type: string, format: uri }
    BookingCreateInput:
      type: object
      additionalProperties: false
      required: [service_id, starts_at]
      properties:
        service_id: { type: integer, format: int64, minimum: 1 }
        starts_at: { type: string, format: date-time, description: لحظه آغاز RFC 3339 با offset }
        payment_method:
          type: string
          enum: [wallet, zarinpal]
          default: wallet
          description: wallet برای پرداخت از مانده کیف پول؛ zarinpal برای پرداخت مستقیم درگاه و وضعیت pending_payment تا تأیید سرور
    Booking:
      type: object
      required: [id, client_id, provider_id, service_id, service_name, starts_at, ends_at, duration_minutes, price_irr, buffer_minutes, status, payment_method, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        client_id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        service_id: { type: integer, format: int64 }
        service_name: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        duration_minutes: { type: integer, minimum: 1, maximum: 1440 }
        price_irr: { type: integer, format: int64, minimum: 0, description: snapshot مبلغ صحیح ریال؛ فقط مبلغ مثبت هنگام ایجاد رزرو در wallet قفل می‌شود }
        buffer_minutes: { type: integer, minimum: 0, maximum: 1440 }
        status:
          type: string
          enum: [pending_payment, confirmed, in_progress, completion_pending, disputed, completed, cancelled, expired]
        payment_method:
          type: string
          enum: [none, wallet, zarinpal]
        payment_expires_at:
          type: [string, 'null']
          format: date-time
          description: مهلت پرداخت رزروهای pending_payment؛ پس از آن رزرو فقط در نبود تلاش پرداخت فعال منقضی می‌شود
        completion_requested_at:
          type: [string, 'null']
          format: date-time
          description: زمان ثبت درخواست تکمیل خدمت توسط ارائه‌دهنده
        completed_at:
          type: [string, 'null']
          format: date-time
          description: زمان نهایی‌شدن وضعیت completed
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PayoutRequest:
      type: object
      required: [id, provider_id, amount_irr, status, admin_note, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        amount_irr: { type: integer, format: int64, minimum: 1, description: مبلغ صحیح ریال }
        status: { type: string, enum: [requested, approved, processing, paid, rejected, failed] }
        external_transfer_reference:
          type: [string, 'null']
          maxLength: 128
          description: ارجاع انتقال بیرونی؛ فقط پس از ثبت پرداخت دستی پر می‌شود
        admin_note: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminPayout:
      type: object
      description: ردیف درخواست تسویه از نگاه مدیر با نام نمایشی ارائه‌دهنده
      allOf:
        - $ref: '#/components/schemas/PayoutRequest'
        - type: object
          required: [provider_display_name]
          properties:
            provider_display_name: { type: string, maxLength: 160 }
    AdminPayoutPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminPayout'
        next_cursor:
          type: [integer, 'null']
          format: int64
    PayoutPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PayoutRequest' } }
        next_cursor: { type: [integer, 'null'], format: int64 }
    PayoutAdminInput:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 1000 }
    BookingPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Booking' }
        next_cursor:
          type: [integer, 'null']
          format: int64
    AdminBooking:
      type: object
      description: ردیف رزرو از نگاه مدیر با اطلاعات تماس مشتری و وضعیت بازپرداخت
      required: [id, status, service_name, starts_at, ends_at, price_irr, payment_method, client_email, provider_display_name, has_open_dispute, refundable, created_at]
      properties:
        id: { type: integer, format: int64 }
        status:
          type: string
          enum: [pending_payment, confirmed, in_progress, completion_pending, disputed, completed, cancelled, expired]
        service_name: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        price_irr: { type: integer, format: int64, minimum: 0, description: مبلغ صحیح ریال }
        payment_method:
          type: string
          enum: [none, wallet, zarinpal]
        client_email: { type: string, format: email, description: اطلاعات تماس مشتری؛ فقط برای مدیر }
        client_phone:
          type: [string, 'null']
          description: تلفن مشتری؛ فقط برای مدیر
        provider_display_name: { type: string, maxLength: 160 }
        has_open_dispute:
          type: boolean
          description: اختلاف حل‌نشده روی این رزرو وجود دارد
        refundable:
          type: boolean
          description: رزرو completed است و قفل تسویه‌شده آن بازپرداخت نشده
        created_at: { type: string, format: date-time }
    AdminBookingPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminBooking' }
        next_cursor:
          type: [integer, 'null']
          format: int64
    AvailabilityResponse:
      type: object
      required: [provider_id, service_id, date, time_zone, slots]
      properties:
        provider_id:
          type: integer
          format: int64
        service_id:
          type: integer
          format: int64
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2025-03-15"
        time_zone:
          type: string
          example: "Asia/Tehran"
        slots:
          type: array
          items:
            type: object
            required: [start_at, end_at]
            properties:
              start_at:
                type: string
                format: date-time
              end_at:
                type: string
                format: date-time
