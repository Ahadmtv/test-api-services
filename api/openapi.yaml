openapi: 3.1.0
info:
  title: API سامانه رزرو خدمات زیبایی
  version: 1.0.0
  description: قرارداد API نسخه یک سامانه رزرو خدمات زیبایی و مراقبت شخصی
servers:
  - url: /
paths:
  /api/v1/auth/register:
    post:
      summary: ثبت‌نام مشتری
      description: حساب جدید با نقش پیش‌فرض `client` ساخته می‌شود؛ نقش `provider` یا `admin` در ثبت‌نام عمومی صادر نمی‌شود. پیام خطا برای ایمیل تکراری و ورودی نامعتبر یکسان است تا شمارش حساب ممکن نباشد و این مسیر محدودیت نرخ دارد.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterInput'
      responses:
        '201':
          description: حساب ایجاد شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/login:
    post:
      summary: ورود
      description: اعتبارنامه‌ها را بررسی و جفت توکن دسترسی و Refresh برمی‌گرداند. پاسخ برای کاربر ناشناخته و رمز نادرست یکسان است و این مسیر محدودیت نرخ دارد.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginInput'
      responses:
        '200':
          description: ورود موفق
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/refresh:
    post:
      summary: تایید مجدد و چرخش توکن Refresh
      description: توکن Refresh ارائه‌شده در یک تراکنش مصرف، لغو و با توکن تازه جایگزین می‌شود؛ نشست تازه ایمیل و نقش‌های جاری کاربر را حفظ می‌کند. استفاده مجدد از توکن چرخیده‌شده به‌عنوان replay شناسایی می‌شود و همه نشست‌های فعال کاربر لغو می‌شوند.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshInput'
      responses:
        '200':
          description: جفت توکن تازه
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/logout:
    post:
      summary: خروج
      description: توکن Refresh ارائه‌شده را لغو می‌کند. فراخوانی با توکن نامعتبر یا غایب هم پاسخ موفق یکسان می‌دهد و وضعیت نشست را افشا نمی‌کند.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshInput'
      responses:
        '200':
          description: خروج انجام شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/me:
    get:
      summary: نمایه کاربر جاری
      description: نمایه کاربر احرازشده را از روی شناسه داخل توکن دسترسی برمی‌گرداند؛ هویت و نقش‌ها از سمت سرور تعیین می‌شوند.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: نمایه کاربر
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/services:
    get:
      summary: فهرست خدمات فعال و تأییدشده
      description: فهرست عمومی خدمات زیبایی فعال متعلق به نمایه‌های فعال و تأییدشده را با صفحه‌بندی cursor-based برمی‌گرداند. با پارامتر `category` می‌توان نتیجه را به یک دسته‌بندی خدمت زیبایی محدود کرد.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: category
          in: query
          required: false
          description: دسته‌بندی خدمت زیبایی؛ مقدار نامعتبر با خطای ۴۰۰ رد می‌شود.
          schema:
            $ref: '#/components/schemas/ServiceCategory'
      responses:
        '200':
          description: صفحه خدمات
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePage'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/services/{serviceID}:
    get:
      summary: دریافت خدمت منتشرشده
      description: فقط خدمت فعال متعلق به نمایه فعال و تأییدشده قابل مشاهده است.
      parameters:
        - $ref: '#/components/parameters/ServiceID'
      responses:
        '200':
          description: خدمت
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/provider/profile:
    get:
      summary: دریافت نمایه ارائه‌دهنده
      description: نمایه متعلق به کاربر احرازشده را برمی‌گرداند.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: نمایه ارائه‌دهنده
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProfile'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      summary: ایجاد یا ویرایش نمایه ارائه‌دهنده
      description: وضعیت تأیید توسط مدیر کنترل می‌شود و این درخواست آن را تغییر نمی‌دهد. منطقه زمانی پیش‌فرض هنگام ایجاد Asia/Tehran است.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderProfileInput'
      responses:
        '200':
          description: نمایه ذخیره‌شده
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProfile'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/provider/services:
    get:
      summary: فهرست خدمات خود ارائه‌دهنده
      description: فهرست خدمات متعلق به کاربر احرازشده را صفحه‌بندی می‌کند.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: صفحه خدمات ارائه‌دهنده
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      summary: ایجاد خدمت
      description: خدمت با مبلغ صحیح ریال ایجاد می‌شود؛ قیمت صفر مجاز است و خدمت حذف فیزیکی نمی‌شود.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
      responses:
        '201':
          description: خدمت ایجادشده
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/provider/services/{serviceID}:
    patch:
      summary: ویرایش خدمت خود ارائه‌دهنده
      description: شناسه خدمت همراه شناسه ارائه‌دهنده احرازشده بررسی می‌شود؛ غیرفعال‌سازی با is_active=false انجام می‌شود.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServiceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePatch'
      responses:
        '200':
          description: خدمت ویرایش‌شده
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      summary: غیرفعال‌سازی خدمت
      description: ردیف خدمت حذف فیزیکی نمی‌شود تا ارجاع‌های تاریخی حفظ شوند.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServiceID'
      responses:
        '204':
          description: خدمت غیرفعال شد
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/provider/working-hours:
    get:
      summary: دریافت ساعات کاری هفتگی
      description: "زمان‌ها ساعت دیواری محلی نمایه ارائه‌دهنده‌اند و timestamp یا UTC نیستند. شماره روز ISO-8601 است: دوشنبه 1 تا یکشنبه 7."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: بازه‌های هفتگی
          content:
            application/json:
              schema:
                type: object
                required: [intervals]
                properties:
                  intervals:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkingInterval'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    put:
      summary: جایگزینی ساعات کاری هفتگی
      description: چند بازه برای هر روز مجاز است. بازه‌ها نیمه‌باز هستند، نباید هم‌پوشانی داشته باشند و عبور از نیمه‌شب مجاز نیست؛ بازه شبانه باید به دو روز شکسته شود.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intervals]
              properties:
                intervals:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkingInterval'
      responses:
        '200':
          description: ساعات ذخیره‌شده
          content:
            application/json:
              schema:
                type: object
                required: [intervals]
                properties:
                  intervals:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkingInterval'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/provider/time-off:
    get:
      summary: فهرست مرخصی و بازه‌های مسدودشده
      description: بازه‌های متعلق به ارائه‌دهنده احرازشده را صفحه‌بندی می‌کند.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: صفحه بازه‌ها
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeOffPage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      summary: ثبت مرخصی یا بازه مسدود
      description: ابتدا و انتها لحظه RFC 3339 با offset هستند و به‌صورت UTC در TIMESTAMPTZ ذخیره می‌شوند. بازه نیمه‌باز است و هم‌پوشانی با بازه دیگر همان ارائه‌دهنده رد می‌شود.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeOffInput'
      responses:
        '201':
          description: بازه ثبت‌شده
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeOff'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/users:
    get:
      summary: فهرست کاربران برای مدیر
      description: حساب‌ها را با صفحه‌بندی cursor-based، جست‌وجوی متنی و فیلتر نقش برمی‌گرداند. نقش‌های بازگشتی وضعیت جاری پایگاه داده هستند و ممکن است با نقش‌های توکن دسترسی متفاوت باشند.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          required: false
          description: جست‌وجو در ایمیل، تلفن و نام نمایشی ارائه‌دهنده
          schema:
            type: string
            maxLength: 100
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [client, provider, admin]
      responses:
        '200':
          description: صفحه کاربران
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/users/{userID}/roles/{role}:
    put:
      summary: اعطا یا لغو نقش کاربر
      description: فقط نقش‌های provider و admin قابل تغییرند. مدیر نمی‌تواند نقش حساب خود را تغییر دهد و آخرین مدیر فعال قابل حذف نیست. تغییر نقش و رخداد حسابرسی در یک تراکنش ثبت می‌شوند و در درخواست‌های بعدی همان توکن نیز اثر می‌کنند.
      security:
        - bearerAuth: []
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [provider, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRoleMutationInput'
      responses:
        '200':
          description: کاربر به‌روزشده
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/providers:
    get:
      summary: فهرست ارائه‌دهندگان برای مدیر
      description: همه نمایه‌های ارائه‌دهنده را با صفحه‌بندی cursor-based، فیلتر وضعیت تأیید و جست‌وجوی متنی (نام نمایشی، ایمیل و تلفن مالک) برمی‌گرداند.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: verification_status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, verified, rejected]
        - name: q
          in: query
          required: false
          description: جست‌وجو در نام نمایشی، ایمیل و تلفن مالک
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: صفحه ارائه‌دهندگان
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProviderPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/providers/{providerID}/verification:
    patch:
      summary: تغییر وضعیت تأیید ارائه‌دهنده
      description: فقط مدیر می‌تواند وضعیت تأیید نمایه را به pending، verified یا rejected تغییر دهد. تأیید (verified) پیش از تکمیل نمایه با خطای 409 و کد profile_incomplete رد می‌شود.
      security:
        - bearerAuth: []
      parameters:
        - name: providerID
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification_status]
              properties:
                verification_status:
                  type: string
                  enum: [pending, verified, rejected]
      responses:
        '200':
          description: نمایه به‌روزشده
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProfile'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
          description: نمایه ناتمام است (profile_incomplete)
  /api/v1/providers/{providerID}/availability:
    get:
      summary: در دسترس بودن زمان‌ها برای ارائه‌دهنده و خدمت
      description: بازه‌های زمانی موجود برای رزرو را برمی‌گرداند. پارامتر `date` تاریخ تقویمی میلادی در منطقه زمانی محلی ارائه‌دهنده است. بازه‌های بازگشتی بر اساس ساعت کاری، مرخصی، رزروهای موجود و بافر محاسبه شده‌اند. نتیجه مشورتی است و تضمین رزرو محسوب نمی‌شود.
      parameters:
        - $ref: '#/components/parameters/ProviderID'
        - name: service_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: "2025-03-15"
            description: تاریخ میلادی در منطقه زمانی ارائه‌دهنده
      responses:
        '200':
          description: بازه‌های موجود
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/wallet:
    get:
      summary: دریافت مانده کیف پول
      description: مانده قابل‌استفاده و مبلغ قفل‌شده کاربر احرازشده را فقط به ریال صحیح برمی‌گرداند. این API عملیات تغییر مانده ندارد.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: مانده فعلی
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletBalance' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/wallet/transactions:
    get:
      summary: تاریخچه اسناد کیف پول
      description: اسناد دفترکل مؤثر بر حساب‌های کاربر احرازشده را با صفحه‌بندی cursor-based برمی‌گرداند.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: صفحه اسناد کیف پول
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletTransactionPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/payments/zarinpal:
    post:
      summary: ایجاد پرداخت Zarinpal برای شارژ کیف پول یا رزرو
      description: فقط مشتری احرازشده می‌تواند پرداخت را آغاز کند. با purpose=wallet_topup مبلغ صحیح IRR حداقل 10000 ریال لازم است و فقط پس از Verify سرور به مانده قابل‌استفاده اضافه می‌شود. با purpose=booking فقط booking_id ارسال می‌شود؛ مالکیت و مبلغ از سرور خوانده می‌شود و در صورت موفقیت مبلغ مستقیماً به قفل رزرو می‌رود، نه کیف پول قابل‌استفاده. callback proof نیست و موفقیت فقط با Verify سرور و گذار اتمی رزرو تعیین می‌شود.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentCreateInput' }
      responses:
        '200':
          description: همان idempotency key نتیجه terminal قبلی را برگرداند
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentCreateResponse' }
        '201':
          description: authority دریافت شد و redirect آماده است
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentCreateResponse' }
        '202':
          description: نتیجه ایجاد پرداخت نامطمئن است؛ درخواست بیرونی به‌طور خودکار تکرار نمی‌شود
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentCreateResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/payments/zarinpal/callback:
    get:
      summary: callback بازگشت کاربر از Zarinpal
      description: پارامترهای Authority و Status مطابق callback واقعی Zarinpal هستند و نام‌های lowercase نیز برای سازگاری پذیرفته می‌شوند. authority رکورد محلی را تعیین می‌کند؛ status فقط داده بازگشت است. موجودی فقط پس از Verify server-to-server و تطبیق با مبلغ و authority محلی تغییر می‌کند. پس از پردازش، مرورگر با هدایت 303 به `PAYMENT_RETURN_URL` (صفحه نتیجه اپ) فرستاده می‌شود.
      parameters:
        - name: Authority
          in: query
          required: true
          schema: { type: string, pattern: '^[AS][A-Za-z0-9]{35}$' }
        - name: Status
          in: query
          required: false
          description: مقدار بازگشتی gateway؛ برای اعتباردهی به آن اعتماد نمی‌شود
          schema: { type: string, maxLength: 32 }
      responses:
        '303':
          description: callback پردازش شد یا نتیجه قبلی حفظ شد؛ مرورگر به صفحه نتیجه فرانت‌اند هدایت می‌شود
          headers:
            Location:
              description: نشانی مطلق صفحه نتیجه که در PAYMENT_RETURN_URL تنظیم شده است
              schema: { type: string, format: uri }
        '204': { description: callback پردازش شد؛ فقط در محیط sandbox بدون PAYMENT_RETURN_URL برای سازگاری برگردانده می‌شود }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/payments/{paymentID}:
    get:
      summary: دریافت وضعیت پرداخت متعلق به مشتری
      security:
        - bearerAuth: []
      parameters:
        - name: paymentID
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: وضعیت و اطلاعات مجاز پرداخت
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/admin/bookings:
    get:
      summary: فهرست رزروها برای مدیر
      description: همه رزروهای سامانه را با صفحه‌بندی cursor-based، فیلتر وضعیت، جست‌وجوی متنی (نام خدمت، ایمیل مشتری و نام نمایشی ارائه‌دهنده) و نمای بازپرداخت‌پذیر برمی‌گرداند. در نمای بازپرداخت‌پذیر فقط رزروهای completed با قفل تسویه‌شده و بازپرداخت‌نشده برمی‌گردند.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending_payment, confirmed, in_progress, completion_pending, disputed, completed, cancelled, expired]
        - name: q
          in: query
          required: false
          description: جست‌وجو در نام خدمت، ایمیل مشتری و نام نمایشی ارائه‌دهنده
          schema:
            type: string
            maxLength: 100
        - name: refundable
          in: query
          required: false
          description: اگر true باشد فقط رزروهای بازپرداخت‌پذیر برمی‌گردند
          schema:
            type: boolean
      responses:
        '200':
          description: صفحه رزروها برای مدیر
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookingPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/bookings/{bookingID}/refund:
    post:
      summary: بازپرداخت رزرو تکمیل‌شده
      description: فقط مدیر مجاز است یک‌بار مبلغ رزرو تکمیل‌شده را با سند معکوس تسویه و آزادسازی قفل به کیف پول مشتری بازگرداند؛ نتیجه به‌صورت اتمی ثبت و قابل تکرار است.
      security:
        - bearerAuth: []
      parameters:
        - name: bookingID
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '204': { description: بازپرداخت ثبت شد یا نتیجه قبلی بازپخش شد }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/bookings:
    post:
      summary: ایجاد رزرو
      description: مشتری شناسه خدمت، زمان آغاز و به‌صورت اختیاری روش پرداخت را ارسال می‌کند؛ مدت، پایان، بافر، مبلغ و ارائه‌دهنده از داده معتبر سرور محاسبه و snapshot می‌شوند. پیش‌فرض payment_method=wallet است و رزرو در همان تراکنش confirmed می‌شود و مبلغ از مانده قابل‌استفاده به قفل می‌رود. با payment_method=zarinpal رزرو pending_payment با payment_expires_at ساخته می‌شود و فقط پس از Verify موفق به confirmed می‌رسد؛ در این مسیر مانده قابل‌استفاده کیف پول تغییر نمی‌کند. اگر مبلغ خدمت مثبت و کمتر از حداقل ۱۰٬۰۰۰ ریال درگاه باشد، درخواست Zarinpal پیش از هرگونه قفل زمان با خطای payment_minimum_not_met و وضعیت 400 رد می‌شود.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: کلید تکرار درخواست در محدوده مشتری و عملیات ایجاد رزرو
          schema:
            type: string
            minLength: 1
            maxLength: 128
