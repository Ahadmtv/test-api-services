openapi: 3.1.0
info:
  title: API سامانه رزرو خدمات
  version: 1.0.0
  description: قرارداد API نسخه یک سامانه رزرو خدمات
servers:
  - url: /
paths:
  /api/v1/services:
    get:
      summary: فهرست خدمات فعال و تأییدشده
      description: فهرست عمومی خدمات فعال متعلق به نمایه‌های فعال و تأییدشده را با صفحه‌بندی cursor-based برمی‌گرداند.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: صفحه خدمات
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePage'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/services/{serviceID}:
    get:
      summary: دریافت خدمت منتشرشده
      description: فقط خدمت فعال متعلق به نمایه فعال و تأییدشده قابل مشاهده است.
      parameters:
        - $ref: '#/components/parameters/ServiceID'
      responses:
        '200':
          description: خدمت
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/provider/profile:
    get:
      summary: دریافت نمایه ارائه‌دهنده
      description: نمایه متعلق به کاربر احرازشده را برمی‌گرداند.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: نمایه ارائه‌دهنده
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProfile'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      summary: ایجاد یا ویرایش نمایه ارائه‌دهنده
      description: وضعیت تأیید توسط مدیر کنترل می‌شود و این درخواست آن را تغییر نمی‌دهد. منطقه زمانی پیش‌فرض هنگام ایجاد Asia/Tehran است.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderProfileInput'
      responses:
        '200':
          description: نمایه ذخیره‌شده
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProfile'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/provider/services:
    get:
      summary: فهرست خدمات خود ارائه‌دهنده
      description: فهرست خدمات متعلق به کاربر احرازشده را صفحه‌بندی می‌کند.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: صفحه خدمات ارائه‌دهنده
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      summary: ایجاد خدمت
      description: خدمت با مبلغ صحیح ریال ایجاد می‌شود؛ قیمت صفر مجاز است و خدمت حذف فیزیکی نمی‌شود.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
      responses:
        '201':
          description: خدمت ایجادشده
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/provider/services/{serviceID}:
    patch:
      summary: ویرایش خدمت خود ارائه‌دهنده
      description: شناسه خدمت همراه شناسه ارائه‌دهنده احرازشده بررسی می‌شود؛ غیرفعال‌سازی با is_active=false انجام می‌شود.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServiceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePatch'
      responses:
        '200':
          description: خدمت ویرایش‌شده
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      summary: غیرفعال‌سازی خدمت
      description: ردیف خدمت حذف فیزیکی نمی‌شود تا ارجاع‌های تاریخی حفظ شوند.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServiceID'
      responses:
        '204':
          description: خدمت غیرفعال شد
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/provider/working-hours:
    get:
      summary: دریافت ساعات کاری هفتگی
      description: "زمان‌ها ساعت دیواری محلی نمایه ارائه‌دهنده‌اند و timestamp یا UTC نیستند. شماره روز ISO-8601 است: دوشنبه 1 تا یکشنبه 7."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: بازه‌های هفتگی
          content:
            application/json:
              schema:
                type: object
                required: [intervals]
                properties:
                  intervals:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkingInterval'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    put:
      summary: جایگزینی ساعات کاری هفتگی
      description: چند بازه برای هر روز مجاز است. بازه‌ها نیمه‌باز هستند، نباید هم‌پوشانی داشته باشند و عبور از نیمه‌شب مجاز نیست؛ بازه شبانه باید به دو روز شکسته شود.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intervals]
              properties:
                intervals:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkingInterval'
      responses:
        '200':
          description: ساعات ذخیره‌شده
          content:
            application/json:
              schema:
                type: object
                required: [intervals]
                properties:
                  intervals:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkingInterval'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/provider/time-off:
    get:
      summary: فهرست مرخصی و بازه‌های مسدودشده
      description: بازه‌های متعلق به ارائه‌دهنده احرازشده را صفحه‌بندی می‌کند.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: صفحه بازه‌ها
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeOffPage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      summary: ثبت مرخصی یا بازه مسدود
      description: ابتدا و انتها لحظه RFC 3339 با offset هستند و به‌صورت UTC در TIMESTAMPTZ ذخیره می‌شوند. بازه نیمه‌باز است و هم‌پوشانی با بازه دیگر همان ارائه‌دهنده رد می‌شود.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeOffInput'
      responses:
        '201':
          description: بازه ثبت‌شده
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeOff'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/providers/{providerID}/verification:
    patch:
      summary: تغییر وضعیت تأیید ارائه‌دهنده
      description: فقط مدیر می‌تواند وضعیت تأیید نمایه را به pending، verified یا rejected تغییر دهد.
      security:
        - bearerAuth: []
      parameters:
        - name: providerID
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification_status]
              properties:
                verification_status:
                  type: string
                  enum: [pending, verified, rejected]
      responses:
        '200':
          description: نمایه به‌روزشده
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProfile'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/providers/{providerID}/availability:
    get:
      summary: در دسترس بودن زمان‌ها برای ارائه‌دهنده و خدمت
      description: بازه‌های زمانی موجود برای رزرو را برمی‌گرداند. پارامتر `date` تاریخ تقویمی میلادی در منطقه زمانی محلی ارائه‌دهنده است. بازه‌های بازگشتی بر اساس ساعت کاری، مرخصی، رزروهای موجود و بافر محاسبه شده‌اند. نتیجه مشورتی است و تضمین رزرو محسوب نمی‌شود.
      parameters:
        - $ref: '#/components/parameters/ProviderID'
        - name: service_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: "2025-03-15"
            description: تاریخ میلادی در منطقه زمانی ارائه‌دهنده
      responses:
        '200':
          description: بازه‌های موجود
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/bookings:
    post:
      summary: ایجاد رزرو
      description: مشتری فقط شناسه خدمت و زمان آغاز را ارسال می‌کند؛ مدت، پایان، بافر، مبلغ و ارائه‌دهنده از داده معتبر سرور محاسبه و snapshot می‌شوند. رزرو در همان تراکنش با وضعیت confirmed ایجاد و تا لغو یا تغییر چرخه رزرو اشغال می‌ماند. تأیید رزرو به معنی دریافت وجه نیست.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: کلید تکرار درخواست در محدوده مشتری و عملیات ایجاد رزرو
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateInput'
      responses:
        '201':
          description: رزرو confirmed یا پاسخ بازپخش‌شده
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    get:
      summary: تاریخچه رزروهای مشتری
      description: رزروهای متعلق به مشتری احرازشده را با صفحه‌بندی cursor-based برمی‌گرداند.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: صفحه رزروها
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/bookings/{bookingID}:
    get:
      summary: دریافت جزئیات رزرو
      description: فقط مشتری یا ارائه‌دهنده همان رزرو می‌تواند جزئیات آن را دریافت کند.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingID'
      responses:
        '200':
          description: جزئیات رزرو و snapshot خدمت
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/bookings/{bookingID}/cancel:
    post:
      summary: لغو رزرو توسط مشتری
      description: رزرو pending قابل لغو است؛ رزرو confirmed تا مهلت پیکربندی‌شده پیش از آغاز قابل لغو است.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingID'
      responses:
        '200':
          description: رزرو لغوشده
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/provider/bookings:
    get:
      summary: فهرست رزروهای ارائه‌دهنده
      description: رزروهای ارائه‌دهنده احرازشده را با صفحه‌بندی cursor-based برمی‌گرداند.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: صفحه رزروها
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/provider/bookings/{bookingID}/start:
    post:
      summary: آغاز خدمت
      description: ارائه‌دهنده همان رزرو می‌تواند رزرو confirmed را از زمان آغاز برنامه‌ریزی‌شده به in_progress ببرد.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingID'
      responses:
        '200':
          description: رزرو در حال انجام
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: شناسه آخرین رکورد صفحه قبلی
      schema:
        type: integer
        format: int64
        minimum: 1
    Limit:
      name: limit
      in: query
      required: false
      description: تعداد رکورد صفحه، پیش‌فرض 50 و حداکثر 100
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ServiceID:
      name: serviceID
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProviderID:
      name: providerID
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    BookingID:
      name: bookingID
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    Problem:
      description: خطای پایدار API
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        request_id: { type: string }
        field_errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
    ProviderProfile:
      type: object
      required: [provider_id, display_name, description, time_zone, is_active, verification_status]
      properties:
        provider_id: { type: integer, format: int64 }
        display_name: { type: string, maxLength: 160 }
        description: { type: string }
        time_zone: { type: string, default: Asia/Tehran }
        is_active: { type: boolean }
        verification_status:
          type: string
          enum: [pending, verified, rejected]
    ProviderProfileInput:
      type: object
      required: [display_name, is_active]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string }
        time_zone:
          type: string
          description: نام منطقه زمانی معتبر IANA
          default: Asia/Tehran
        is_active: { type: boolean }
    Service:
      type: object
      required: [id, provider_id, name, description, duration_minutes, price_irr, buffer_minutes, is_active]
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        duration_minutes: { type: integer, minimum: 1, maximum: 1440 }
        price_irr: { type: integer, format: int64, minimum: 0, description: مبلغ صحیح ریال }
        buffer_minutes: { type: integer, minimum: 0, maximum: 1440 }
        is_active: { type: boolean }
    ServiceInput:
      type: object
      required: [name, duration_minutes, price_irr]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string }
        duration_minutes: { type: integer, minimum: 1, maximum: 1440 }
        price_irr: { type: integer, format: int64, minimum: 0 }
        buffer_minutes: { type: integer, minimum: 0, maximum: 1440, default: 0 }
        is_active: { type: boolean, default: true }
    ServicePatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string }
        duration_minutes: { type: integer, minimum: 1, maximum: 1440 }
        price_irr: { type: integer, format: int64, minimum: 0 }
        buffer_minutes: { type: integer, minimum: 0, maximum: 1440 }
        is_active: { type: boolean }
    ServicePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Service' }
        next_cursor:
          type: [integer, 'null']
          format: int64
    WorkingInterval:
      type: object
      required: [weekday, opens_at, closes_at]
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7, description: روز ISO-8601؛ دوشنبه 1 و یکشنبه 7 }
        opens_at:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          description: ساعت محلی HH:MM در منطقه زمانی نمایه
        closes_at:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          description: پایان همان روز و بزرگ‌تر از آغاز
    TimeOff:
      type: object
      required: [id, kind, starts_at, ends_at, reason]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [time_off, blocked, holiday] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        reason: { type: string }
        holiday_date: { type: [string, 'null'], format: date }
    TimeOffInput:
      oneOf:
        - type: object
          required: [kind, starts_at, ends_at]
          properties:
            kind: { type: string, enum: [time_off, blocked] }
            starts_at: { type: string, format: date-time }
            ends_at: { type: string, format: date-time }
            reason: { type: string, maxLength: 500 }
        - type: object
          required: [kind, holiday_date]
          properties:
            kind: { type: string, const: holiday }
            holiday_date: { type: string, format: date }
    TimeOffPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TimeOff' }
        next_cursor:
          type: [integer, 'null']
          format: int64
    BookingCreateInput:
      type: object
      additionalProperties: false
      required: [service_id, starts_at]
      properties:
        service_id: { type: integer, format: int64, minimum: 1 }
        starts_at: { type: string, format: date-time, description: لحظه آغاز RFC 3339 با offset }
    Booking:
      type: object
      required: [id, client_id, provider_id, service_id, service_name, starts_at, ends_at, duration_minutes, price_irr, buffer_minutes, status, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        client_id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        service_id: { type: integer, format: int64 }
        service_name: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        duration_minutes: { type: integer, minimum: 1, maximum: 1440 }
        price_irr: { type: integer, format: int64, minimum: 0, description: snapshot مبلغ صحیح ریال؛ دریافت یا قفل وجه انجام نمی‌شود }
        buffer_minutes: { type: integer, minimum: 0, maximum: 1440 }
        status:
          type: string
          enum: [confirmed, in_progress, completed, cancelled, expired]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BookingPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Booking' }
        next_cursor:
          type: [integer, 'null']
          format: int64
    AvailabilityResponse:
      type: object
      required: [provider_id, service_id, date, time_zone, slots]
      properties:
        provider_id:
          type: integer
          format: int64
        service_id:
          type: integer
          format: int64
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2025-03-15"
        time_zone:
          type: string
          example: "Asia/Tehran"
        slots:
          type: array
          items:
            type: object
            required: [start_at, end_at]
            properties:
              start_at:
                type: string
                format: date-time
              end_at:
                type: string
                format: date-time
