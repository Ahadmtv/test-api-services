          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateInput'
      responses:
        '201':
          description: رزرو confirmed، رزرو pending_payment در انتظار پرداخت، یا پاسخ بازپخش‌شده
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    get:
      summary: تاریخچه رزروهای مشتری
      description: رزروهای متعلق به مشتری احرازشده را با صفحه‌بندی cursor-based برمی‌گرداند.
